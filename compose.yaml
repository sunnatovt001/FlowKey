services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowza
      POSTGRES_PASSWORD: flowza_local_only
      POSTGRES_DB: flowza
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowza_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowza"]
      interval: 5s
      retries: 10
volumes:
  flowza_data:
